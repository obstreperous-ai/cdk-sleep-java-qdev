name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js for CDK
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install AWS CDK
      run: npm install -g aws-cdk

    - name: Verify Maven installation
      run: mvn --version

    - name: Run Maven tests
      run: mvn clean test

    - name: Generate coverage report
      run: mvn jacoco:report

    - name: Extract coverage percentage
      id: coverage
      run: |
        if [ -f target/site/jacoco/index.html ]; then
          echo "✅ Coverage report created successfully"
          
          # Extract coverage percentage from JaCoCo report
          COVERAGE=$(grep -oP 'Total[^%]*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+' | head -1 || echo "0")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "📊 Code Coverage: ${COVERAGE}%"
        else
          echo "coverage=0" >> $GITHUB_OUTPUT
          echo "⚠️ Coverage report not found"
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/site/jacoco/
        retention-days: 30

    - name: Add coverage to job summary
      run: |
        echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Coverage:** ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
        echo "**Target:** 80%+" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 Download the full coverage report from the workflow artifacts." >> $GITHUB_STEP_SUMMARY
        
    - name: Build Maven package
      run: mvn package

    - name: CDK Synth
      run: cdk synth

